name: Build Windows Desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "icon-192.png"
      - "icon-512.png"
      - "desktop/**"
      - ".github/workflows/build-windows-desktop.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Windows icon
        shell: pwsh
        run: |
          python -m pip install pillow
          New-Item -ItemType Directory -Force -Path desktop/src-tauri/icons | Out-Null
          python -c "from PIL import Image; im=Image.open('icon-512.png').convert('RGBA'); im.save('desktop/src-tauri/icons/icon.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install Tauri CLI
        working-directory: desktop
        run: npm install

      - name: Build portable Windows EXE
        working-directory: desktop
        run: npm run build:win

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: W11-Upgrade-Assistant-Windows
          path: desktop/src-tauri/target/release/w11-upgrade-assistant.exe
          if-no-files-found: error
