<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f2b67"><title>PC Monitor</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#6b7280;--line:#dfe3eb;--accent:#1f2b67;--ok:#157347;--warn:#9a6700;--bad:#b42318}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}.wrap{max-width:850px;margin:auto;padding:14px}.hero{background:linear-gradient(135deg,#1f2b67,#384aa6);color:#fff;padding:20px;border-radius:20px}.hero h1{margin:0 0 5px}.hero p{margin:0;opacity:.9}.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}.stat,.pc,.config{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}.stat small{display:block;color:var(--muted);font-size:12px}.stat strong{font-size:22px}.toolbar{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}button,input{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line)}button{border:0;background:var(--accent);color:#fff;font-weight:750;cursor:pointer}.pc{margin:9px 0}.pcHead{display:flex;align-items:center;justify-content:space-between;gap:10px}.name{font-weight:850;font-size:17px}.badge{padding:4px 8px;border-radius:999px;font-size:12px;font-weight:800}.online{background:#e8f5ee;color:var(--ok)}.offline{background:#fdecec;color:var(--bad)}.pending{background:#fff3cd;color:var(--warn)}.failed{background:#fdecec;color:var(--bad)}.meta{margin-top:7px;color:var(--muted);font-size:13px;line-height:1.45}.alert{margin-top:8px;font-weight:750;color:var(--bad)}.empty{text-align:center;color:var(--muted);padding:28px}.config{margin-top:12px}.config input{width:100%;margin-top:8px}.small{font-size:12px;color:var(--muted)}#status{margin:8px 0;font-size:13px;color:var(--muted)}
@media(max-width:650px){.summary{grid-template-columns:repeat(2,1fr)}.summary .stat:first-child{grid-column:1/-1}}
</style></head>
<body><main class="wrap">
<section class="hero"><h1>Mini console Windows Update</h1><p>Stato live dei PC, reboot ed esito aggiornamenti.</p></section>
<section class="config"><b>Collegamento centrale</b><div class="small">URL Apps Script e chiave dashboard restano solo su questo dispositivo.</div><input id="url" placeholder="URL Web App Apps Script"><input id="key" type="password" placeholder="Chiave MONITOR_DASHBOARD_KEY"><div class="toolbar"><button id="save">Salva e collega</button><button id="refresh">Aggiorna</button></div></section>
<div id="status">Non collegata.</div>
<section class="summary"><div class="stat"><small>PC totali</small><strong id="total">–</strong></div><div class="stat"><small>Online</small><strong id="online">–</strong></div><div class="stat"><small>Offline</small><strong id="offline">–</strong></div><div class="stat"><small>Reboot pending</small><strong id="pending">–</strong></div><div class="stat"><small>Update falliti</small><strong id="failed">–</strong></div></section>
<section id="pcs"><div class="empty">Configura il collegamento per vedere i PC.</div></section>
</main><script>
const $=id=>document.getElementById(id);let timer=null;
$('url').value=localStorage.getItem('monitorUrl')||'';$('key').value=localStorage.getItem('monitorKey')||'';
$('save').onclick=()=>{localStorage.setItem('monitorUrl',$('url').value.trim());localStorage.setItem('monitorKey',$('key').value);load()};$('refresh').onclick=load;
function age(sec){if(sec==null)return 'mai';if(sec<60)return sec+' s fa';if(sec<3600)return Math.floor(sec/60)+' min fa';if(sec<86400)return Math.floor(sec/3600)+' h fa';return Math.floor(sec/86400)+' g fa'}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function priority(p){if(p.updateStatus==='UPDATE_FAILED')return 0;if(p.rebootPending)return 1;if(p.connectivity==='OFFLINE')return 2;return 3}
async function load(){const base=$('url').value.trim(),key=$('key').value;if(!base||!key){$('status').textContent='Inserisci URL e chiave dashboard.';return}try{$('status').textContent='Aggiornamento…';const u=new URL(base);u.searchParams.set('api','dashboard');u.searchParams.set('key',key);const r=await fetch(u,{cache:'no-store'});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||('HTTP '+r.status));render(d);$('status').textContent='Aggiornata '+new Date(d.generatedAtUtc).toLocaleTimeString('it-IT');}catch(e){$('status').textContent='Errore collegamento: '+e.message}}
function render(d){for(const k of ['total','online','offline'])$(k).textContent=d.summary[k];$('pending').textContent=d.summary.rebootPending;$('failed').textContent=d.summary.updateFailed;const pcs=[...(d.pcs||[])].sort((a,b)=>priority(a)-priority(b)||a.pc.localeCompare(b.pc));$('pcs').innerHTML=pcs.length?pcs.map(p=>{const on=p.connectivity==='ONLINE',lr=p.lastReboot||{},dur=lr.durationMin==null?'–':lr.durationMin+' min',upd=p.updateStatus||lr.updateStatus||'nessun esito';let alerts=[];if(p.updateStatus==='UPDATE_FAILED')alerts.push('⚠️ Ultimo aggiornamento fallito');if(p.rebootPending)alerts.push('↻ Riavvio richiesto');return `<article class="pc"><div class="pcHead"><span class="name">${esc(p.pc||p.agentId)}</span><span class="badge ${on?'online':'offline'}">${on?'● ONLINE':'● OFFLINE'}</span></div><div class="meta">Ultimo contatto: ${age(p.lastContactAgeSec)} · Windows ${esc(p.windows)} ${esc(p.build)}<br>Update: ${esc(upd)}${p.updateTitle?' · '+esc(p.updateTitle):''}<br>Ultimo reboot: ${esc(dur)}${lr.outcome?' · '+esc(lr.outcome):''}</div>${alerts.length?`<div class="alert">${alerts.join(' · ')}</div>`:''}</article>`}).join(''):'<div class="empty">Nessun PC registrato.</div>'}
if($('url').value&&$('key').value){load();timer=setInterval(load,30000)}
</script></body></html>
